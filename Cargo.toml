[package]
name = "git-repostats"
version = "0.1.0"
description = "Fast Git analytics tool powered by Rust, providing detailed author contribution statistics including commits, lines of code, insertions, deletions, and churn."
edition = "2024"
repository = "https://github.com/kishorninawe/git-repostats"
license-file = "LICENSE"
include = [
    "Cargo.toml",
    "LICENSE",
    "pyproject.toml",
    "README.md",
    "rust-toolchain.toml",
    "python",
    "src",
    "!__pycache__",
    "!.venv/**",
]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "suggestions", "derive"] }
console = { version = "0.16.6", default-features = false, features = ["ansi-parsing", "std"] }
csv = "1.4.0"
indicatif = "0.18.6"
num-format = { version = "0.4.4", default-features = false, features = ["std"]}
rayon = "1.12.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["serialize"]}
serde_json = "1.0.151"
tabled = { version = "0.22.0", default-features = false, features = ["derive"] }
thiserror = "2.0.21"

[package.metadata.dist]
dist = true

[[bin]]
name = "git-repostats"
path = "src/main.rs"